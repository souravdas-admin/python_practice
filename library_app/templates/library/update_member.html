{% extends 'library/base.html' %}

{% block title %}Update Member | Library Management{% endblock %}

{% block content %}

<style>
    .form-page {
        max-width: 650px;
        margin: 45px auto;
    }

    .form-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .form-header h1 {
        font-size: 38px;
        color: #172554;
        margin-bottom: 8px;
    }

    .form-header p {
        color: #64748b;
    }

    .form-card {
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    .form-card p {
        margin-bottom: 18px;
    }

    .form-card label {
        display: block;
        font-weight: 600;
        color: #334155;
        margin-bottom: 7px;
    }

    .form-card input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .form-card input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .submit-btn {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 9px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #2563eb;
        text-decoration: none;
    }
</style>

<div class="form-page">

    <div class="form-header">
        <h1>✏️ Update Member</h1>
        <p>Modify the member's details.</p>
    </div>

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ member_form.as_p }}

            <button type="submit" class="submit-btn">
                Save Changes
            </button>

        </form>

        <a href="{% url 'show_all_members' %}" class="back-link">
            <br>
            ← Back to Members
        </a>

    </div>

</div>

{% endblock %}
